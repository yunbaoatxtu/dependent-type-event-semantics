name: Verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Coq
        run: |
          sudo apt-get update
          sudo apt-get install -y coq
          coqc --version
      - name: Install document test dependency
        run: python -m pip install ".[docx]"
      - name: Run deterministic checks
        run: python scripts/verify_project.py --require-coq --require-docx
